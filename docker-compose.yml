# Local development database. Production uses a Dokploy Postgres service instead.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sofia
      POSTGRES_PASSWORD: sofia
      POSTGRES_DB: sofia
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
